[build]
builder = "RAILPACK"
buildCommand = "npm run build:admin"
watchPatterns = ["/apps/admin/**", "/packages/**", "/package.json", "/package-lock.json", "/prisma.config.ts", "/railway.admin.toml"]

[deploy]
startCommand = "npm run start:admin -- --hostname 0.0.0.0"
healthcheckPath = "/connexion"
healthcheckTimeout = 120
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
