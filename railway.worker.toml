[build]
builder = "RAILPACK"
buildCommand = "npm run db:generate"
watchPatterns = ["/apps/website/lib/**", "/apps/website/config/**", "/apps/admin/lib/**", "/packages/**", "/scripts/process-outbox.ts", "/package.json", "/package-lock.json", "/prisma.config.ts", "/scripts/wait-for-migrations.ts", "/railway.worker.toml"]

[deploy]
preDeployCommand = ["npm run db:migrate:wait:worker"]
startCommand = "npm run outbox:watch"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
